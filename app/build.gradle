plugins {
    id 'com.android.application'
}

android {
    namespace 'vn.tendoo.iptv'
    compileSdk 35
    defaultConfig {
        applicationId 'vn.tendoo.iptv'
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        debug { minifyEnabled false }
        release {
            minifyEnabled true
            shrinkResources true
            // Test signing only; provide a stable release keystore before distributing production updates.
            signingConfig signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }
}

// Bundle the repository playlist directly as an APK asset; no generation task.
android.sourceSets.main.assets.srcDirs += [file("$rootDir/playlist")]

// Android SDK MediaPlayer handles HLS; zero third-party runtime dependencies.
