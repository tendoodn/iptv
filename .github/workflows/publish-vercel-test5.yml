name: Publish Vercel-built Tendoo IPTV test5 picture-card APK

# This workflow DOES NOT build Android code. It receives the APK compiled inside
# Vercel Sandbox and uploads those verified bytes as a durable GitHub release.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-vercel-test5.yml'

permissions:
  contents: write

jobs:
  publish-vercel-artifact:
    runs-on: ubuntu-latest
    steps:
      - name: Download APK produced by Vercel Sandbox
        run: |
          curl --fail --location --retry 4 --retry-delay 2 \
            'https://sb-3qbev1h4c940.vercel.run/Tendoo-IPTV-Home-1.0.0-test5.apk' \
            --output Tendoo-IPTV-Home-1.0.0-test5.apk
          test "$(wc -c < Tendoo-IPTV-Home-1.0.0-test5.apk)" -eq 1963892
          printf '%s  %s\n' \
            '92e552a348a7d748b9e70b9a4cb3316fc3dccd010b514ee8aac08630a041f5d3' \
            Tendoo-IPTV-Home-1.0.0-test5.apk | sha256sum --check
      - name: Upload exact Vercel-built APK to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view iptv-v1.0.0-test5 >/dev/null 2>&1; then
            gh release upload iptv-v1.0.0-test5 Tendoo-IPTV-Home-1.0.0-test5.apk --clobber
          else
            gh release create iptv-v1.0.0-test5 Tendoo-IPTV-Home-1.0.0-test5.apk \
              --title 'Tendoo IPTV Home 1.0.0.test5 · Vercel Sandbox build' \
              --prerelease \
              --notes 'Native Android APK compiled on Vercel Sandbox (not GitHub Actions). Built from CleanYourTV layout; real horizontal Leanback app-banner cards, rounded image clipping, big-icon fallback and white focus frame; five tiles/row by default, optional 6; two app rows and two channel-logo rows; 46 broadcaster logos packed offline, IPTV Media3 player, user-confirmed HOME selection. Verified 1963892 bytes SHA-256 92e552a348a7d748b9e70b9a4cb3316fc3dccd010b514ee8aac08630a041f5d3. Test signed; device compatibility and live channel playback require device verification.'
          fi
